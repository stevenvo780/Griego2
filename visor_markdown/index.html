<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Markdown - Griego Clásico</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --darker: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --sidebar-width: 280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            display: flex;
            height: 100vh;
            background: var(--darker);
            color: var(--light);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--dark);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            position: relative;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            overflow: hidden;
            border-right: none;
        }

        .sidebar-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 56px;
        }

        .sidebar-toggle {
            position: absolute;
            right: -40px;
            top: 8px;
            width: 36px;
            height: 36px;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0 8px 8px 0;
            color: var(--light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            transition: all 0.2s;
            z-index: 101;
        }

        .sidebar.collapsed .sidebar-toggle {
            right: -40px;
        }

        .sidebar-toggle:hover {
            background: var(--primary);
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .folder { margin-bottom: 2px; }

        .folder-name {
            padding: 8px 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8em;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .folder-name:hover {
            color: var(--light);
            background: rgba(255,255,255,0.05);
        }

        .folder-name .icon { transition: transform 0.2s; }
        .folder.open .folder-name .icon { transform: rotate(90deg); }

        .folder-contents {
            display: none;
            padding-left: 10px;
        }

        .folder.open .folder-contents { display: block; }

        .file-item {
            padding: 8px 15px 8px 25px;
            cursor: pointer;
            font-size: 0.85em;
            border-left: 3px solid transparent;
            color: #94a3b8;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--light);
            border-left-color: var(--primary);
        }

        .file-item.active {
            background: rgba(99, 102, 241, 0.2);
            color: var(--light);
            border-left-color: var(--primary);
        }

        /* Main area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* Top toolbar */
        .top-toolbar {
            background: var(--dark);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
        }

        .toolbar-section {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            margin: 0 8px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-sm { padding: 6px 10px; font-size: 0.75em; }

        .btn-icon {
            padding: 8px;
            min-width: 34px;
            justify-content: center;
        }

        .btn-default {
            background: rgba(255,255,255,0.1);
            color: var(--light);
        }

        .btn-default:hover { background: rgba(255,255,255,0.2); }
        .btn-default.active { background: var(--primary); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }

        .grid-selector {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 6px;
        }

        .grid-selector .btn {
            padding: 6px 10px;
            background: transparent;
        }

        .grid-selector .btn.active { background: var(--primary); }

        /* Panels container */
        .panels-container {
            flex: 1;
            display: grid;
            gap: 2px;
            background: rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .panels-container.grid-1 { grid-template-columns: 1fr; }
        .panels-container.grid-2 { grid-template-columns: 1fr 1fr; }
        .panels-container.grid-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .panels-container.grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        /* Panel */
        .panel {
            background: var(--darker);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .panel.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 0.9em;
        }

        .panel-header {
            padding: 8px 12px;
            background: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            min-height: 42px;
        }

        .panel-title {
            flex: 1;
            font-size: 0.85em;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-mode-toggle {
            display: flex;
            gap: 2px;
            background: rgba(0,0,0,0.3);
            padding: 2px;
            border-radius: 4px;
        }

        .panel-mode-toggle .btn {
            padding: 4px 8px;
            font-size: 0.7em;
            background: transparent;
        }

        .panel-mode-toggle .btn.active { background: var(--primary); }

        .panel-close {
            padding: 4px 8px;
            background: transparent;
            border: none;
            color: var(--gray);
            cursor: pointer;
            border-radius: 4px;
            font-size: 1em;
        }

        .panel-close:hover { background: var(--danger); color: white; }

        .panel-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Editor pane */
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            overflow: hidden;
        }

        .editor-pane.hidden { display: none; }

        .CodeMirror {
            flex: 1;
            height: 100% !important;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Preview pane */
        .preview-pane {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
            background: var(--light);
        }

        .preview-pane.hidden { display: none; }

        .markdown-content {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
            font-size: 15px;
            color: #1e293b;
            font-family: 'Georgia', serif;
        }

        .markdown-content h1 {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            margin: 1.2em 0 0.6em;
            font-size: 1.9em;
            font-weight: 800;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 0.3em;
        }

        .markdown-content h2 {
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            margin: 1.2em 0 0.5em;
            font-size: 1.5em;
            font-weight: 700;
        }

        .markdown-content h3 {
            font-family: 'Inter', sans-serif;
            color: #334155;
            margin: 1em 0 0.4em;
            font-size: 1.25em;
            font-weight: 600;
        }

        .markdown-content h1:first-child { margin-top: 0; }

        .markdown-content p { margin: 1em 0; text-align: justify; }

        .markdown-content ul, .markdown-content ol {
            margin: 1em 0;
            padding-left: 1.8em;
        }

        .markdown-content li { margin: 0.4em 0; }

        .markdown-content code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: #be185d;
        }

        .markdown-content pre {
            background: var(--darker);
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5em 0;
        }

        .markdown-content pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.5em 0;
            font-size: 0.9em;
        }

        .markdown-content th, .markdown-content td {
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            text-align: left;
        }

        .markdown-content th {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .markdown-content tr:nth-child(even) { background: #f8fafc; }

        .markdown-content blockquote {
            border-left: 4px solid var(--primary);
            padding: 15px 25px;
            margin: 1.5em 0;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: #475569;
        }

        .markdown-content hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            margin: 2em 0;
        }

        .markdown-content a { color: var(--primary); text-decoration: none; }
        .markdown-content a:hover { text-decoration: underline; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--dark);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
            border-left: 4px solid var(--success);
        }

        .toast.show { transform: translateY(0); opacity: 1; }

        /* Empty state */
        .empty-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--gray);
            gap: 10px;
        }

        .empty-panel-icon { font-size: 3em; opacity: 0.5; }
        .empty-panel-text { font-size: 0.9em; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
        .preview-pane::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }

        /* Status bar */
        .status-bar {
            background: var(--dark);
            padding: 4px 15px;
            font-size: 0.75em;
            color: var(--gray);
            display: flex;
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .status-item { display: flex; align-items: center; gap: 5px; }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>📚</span> Griego Clásico
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Colapsar/Expandir">◀</button>
        <div class="file-tree" id="file-tree"></div>
    </div>

    <div class="main">
        <div class="top-toolbar">
            <div class="toolbar-section">
                <span style="color: var(--gray); font-size: 0.8em;">Grid:</span>
                <div class="grid-selector">
                    <button class="btn btn-sm active" onclick="setGrid(1)" data-grid="1" title="1 panel">▢</button>
                    <button class="btn btn-sm" onclick="setGrid(2)" data-grid="2" title="2 paneles">▢▢</button>
                    <button class="btn btn-sm" onclick="setGrid(4)" data-grid="4" title="4 paneles">⊞</button>
                </div>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-section">
                <button class="btn btn-default btn-sm" onclick="copyForDocs()" title="Copiar para Google Docs">
                    📋 Copiar
                </button>
                <button class="btn btn-success btn-sm" onclick="exportPDF()" title="Exportar PDF">
                    📄 PDF
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-section">
                <button class="btn btn-default btn-sm" onclick="saveCurrentPanel()" title="Guardar (Ctrl+S)">
                    💾 Guardar
                </button>
            </div>
        </div>

        <div class="panels-container grid-1" id="panels-container">
            <div class="panel" id="panel-0" data-index="0">
                <div class="empty-panel">
                    <div class="empty-panel-icon">📄</div>
                    <div class="empty-panel-text">Selecciona un archivo del panel izquierdo</div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Conectado</span>
            </div>
            <div class="status-item" id="active-panel-info">Panel activo: 1</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // State
        let panels = [
            { file: null, content: '', editor: null, mode: 'preview' }
        ];
        let activePanel = 0;
        let gridSize = 1;
        let files = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFileList();
            setupKeyboardShortcuts();
        });

        // Sidebar toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            const btn = sidebar.querySelector('.sidebar-toggle');
            btn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }

        // Grid management
        function setGrid(size) {
            gridSize = size;
            const container = document.getElementById('panels-container');
            container.className = 'panels-container grid-' + size;

            // Update buttons
            document.querySelectorAll('.grid-selector .btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.grid) === size);
            });

            // Ensure we have enough panels
            while (panels.length < size) {
                panels.push({ file: null, content: '', editor: null, mode: 'preview' });
            }

            renderPanels();
        }

        // Render all panels
        function renderPanels() {
            const container = document.getElementById('panels-container');
            container.innerHTML = '';

            for (let i = 0; i < gridSize; i++) {
                const panel = panels[i];
                const div = document.createElement('div');
                div.className = 'panel' + (i === activePanel ? ' active' : '');
                div.id = 'panel-' + i;
                div.dataset.index = i;
                div.onclick = (e) => {
                    if (!e.target.closest('.panel-header button')) {
                        setActivePanel(i);
                    }
                };

                if (panel.file) {
                    div.innerHTML = `
                        <div class="panel-header">
                            <span class="panel-title" title="${panel.file}">${panel.file.split('/').pop().replace('.md', '')}</span>
                            <div class="panel-mode-toggle">
                                <button class="btn ${panel.mode === 'edit' ? 'active' : ''}" onclick="setPanelMode(${i}, 'edit')">✏️</button>
                                <button class="btn ${panel.mode === 'split' ? 'active' : ''}" onclick="setPanelMode(${i}, 'split')">📖</button>
                                <button class="btn ${panel.mode === 'preview' ? 'active' : ''}" onclick="setPanelMode(${i}, 'preview')">👁️</button>
                            </div>
                            <button class="panel-close" onclick="closePanel(${i})" title="Cerrar">✕</button>
                        </div>
                        <div class="panel-content">
                            <div class="editor-pane ${panel.mode === 'preview' ? 'hidden' : ''}" id="editor-${i}">
                                <textarea id="textarea-${i}"></textarea>
                            </div>
                            <div class="preview-pane ${panel.mode === 'edit' ? 'hidden' : ''}" id="preview-${i}">
                                <div class="markdown-content" id="content-${i}"></div>
                            </div>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="empty-panel">
                            <div class="empty-panel-icon">📄</div>
                            <div class="empty-panel-text">Panel ${i + 1} - Selecciona un archivo</div>
                        </div>
                    `;
                }

                container.appendChild(div);

                // Initialize editor if file is loaded
                if (panel.file) {
                    initPanelEditor(i);
                }
            }

            updateActivePanelInfo();
        }

        // Initialize CodeMirror for a panel
        function initPanelEditor(index) {
            const textarea = document.getElementById('textarea-' + index);
            if (!textarea) return;

            const editor = CodeMirror.fromTextArea(textarea, {
                mode: 'markdown',
                theme: 'dracula',
                lineNumbers: true,
                lineWrapping: true,
                extraKeys: {
                    'Ctrl-S': () => savePanel(index),
                    'Cmd-S': () => savePanel(index)
                }
            });

            editor.setValue(panels[index].content);
            editor.on('change', () => {
                panels[index].content = editor.getValue();
                updatePanelPreview(index);
            });

            panels[index].editor = editor;
            updatePanelPreview(index);
        }

        // Update preview for a panel
        function updatePanelPreview(index) {
            const content = document.getElementById('content-' + index);
            if (content) {
                content.innerHTML = marked.parse(panels[index].content);
            }
        }

        // Set panel mode
        function setPanelMode(index, mode) {
            panels[index].mode = mode;

            const editorPane = document.getElementById('editor-' + index);
            const previewPane = document.getElementById('preview-' + index);

            if (editorPane && previewPane) {
                editorPane.classList.toggle('hidden', mode === 'preview');
                previewPane.classList.toggle('hidden', mode === 'edit');

                if (panels[index].editor) {
                    panels[index].editor.refresh();
                }
            }

            // Update buttons
            const panel = document.getElementById('panel-' + index);
            panel.querySelectorAll('.panel-mode-toggle .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Set active panel
        function setActivePanel(index) {
            activePanel = index;
            document.querySelectorAll('.panel').forEach((p, i) => {
                p.classList.toggle('active', i === index);
                p.style.outline = i === index ? '2px solid var(--primary)' : 'none';
            });
            updateActivePanelInfo();
        }

        function updateActivePanelInfo() {
            const info = document.getElementById('active-panel-info');
            const panel = panels[activePanel];
            if (panel && panel.file) {
                info.textContent = `Panel ${activePanel + 1}: ${panel.file.split('/').pop()}`;
            } else {
                info.textContent = `Panel activo: ${activePanel + 1}`;
            }
        }

        // Close panel
        function closePanel(index) {
            panels[index] = { file: null, content: '', editor: null, mode: 'preview' };
            renderPanels();
        }

        // Load file list
        async function loadFileList() {
            try {
                const response = await fetch('/api/files');
                files = await response.json();
                renderFileTree(files);
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }

        // Render file tree
        function renderFileTree(files) {
            const tree = {};

            files.forEach(file => {
                const parts = file.split('/');
                let current = tree;

                for (let i = 0; i < parts.length - 1; i++) {
                    if (!current[parts[i]]) {
                        current[parts[i]] = { __files: [] };
                    }
                    current = current[parts[i]];
                }

                if (!current.__files) current.__files = [];
                current.__files.push({ name: parts[parts.length - 1], path: file });
            });

            const container = document.getElementById('file-tree');
            container.innerHTML = renderFolder(tree);

            // Event listeners
            container.querySelectorAll('.folder-name').forEach(el => {
                el.onclick = () => el.parentElement.classList.toggle('open');
            });

            container.querySelectorAll('.file-item').forEach(el => {
                el.onclick = () => loadFileToPanel(el.dataset.path, activePanel);
            });
        }

        function renderFolder(obj) {
            let html = '';

            for (const key of Object.keys(obj).sort()) {
                if (key === '__files') continue;
                html += `
                    <div class="folder">
                        <div class="folder-name"><span class="icon">▶</span> ${key}</div>
                        <div class="folder-contents">${renderFolder(obj[key])}</div>
                    </div>
                `;
            }

            if (obj.__files) {
                obj.__files.sort((a, b) => a.name.localeCompare(b.name)).forEach(file => {
                    html += `<div class="file-item" data-path="${file.path}">📄 ${file.name.replace('.md', '')}</div>`;
                });
            }

            return html;
        }

        // Load file to panel
        async function loadFileToPanel(path, panelIndex) {
            try {
                const response = await fetch('/api/file?path=' + encodeURIComponent(path));
                const data = await response.json();

                panels[panelIndex] = {
                    file: path,
                    content: data.content,
                    editor: null,
                    mode: panels[panelIndex].mode || 'preview'
                };

                renderPanels();
                setActivePanel(panelIndex);
                showToast('Archivo cargado: ' + path.split('/').pop());

            } catch (error) {
                console.error('Error loading file:', error);
                showToast('Error al cargar archivo');
            }
        }

        // Save panel
        async function savePanel(index) {
            const panel = panels[index];
            if (!panel.file) return;

            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: panel.file, content: panel.content })
                });

                if (response.ok) {
                    showToast('Guardado: ' + panel.file.split('/').pop());
                }
            } catch (error) {
                showToast('Error al guardar');
            }
        }

        function saveCurrentPanel() {
            savePanel(activePanel);
        }

        // Copy for docs
        function copyForDocs() {
            const panel = panels[activePanel];
            if (!panel.file) {
                showToast('Selecciona un archivo primero');
                return;
            }

            const content = document.getElementById('content-' + activePanel);
            if (!content) {
                showToast('Cambia a modo vista para copiar');
                return;
            }

            const range = document.createRange();
            range.selectNode(content);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
            selection.removeAllRanges();

            showToast('Copiado para Google Docs');
        }

        // Export PDF
        function exportPDF() {
            const panel = panels[activePanel];
            if (!panel.file) {
                showToast('Selecciona un archivo primero');
                return;
            }

            const element = document.getElementById('content-' + activePanel);
            if (!element) {
                showToast('Cambia a modo vista para exportar');
                return;
            }

            const filename = panel.file.split('/').pop().replace('.md', '.pdf');

            html2pdf().set({
                margin: [15, 20, 15, 20],
                filename: filename,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save();

            showToast('Generando PDF...');
        }

        // Keyboard shortcuts
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveCurrentPanel();
                }

                // Switch panels with Ctrl+1,2,3,4
                if ((e.ctrlKey || e.metaKey) && e.key >= '1' && e.key <= '4') {
                    const index = parseInt(e.key) - 1;
                    if (index < gridSize) {
                        e.preventDefault();
                        setActivePanel(index);
                    }
                }
            });
        }

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
