version: '3.8'

services:
  griego-md:
    build:
      context: ..
      dockerfile: visor_markdown/Dockerfile
    container_name: griego-markdown
    ports:
      - "8888:8888"
      - "8889:8889"
    volumes:
      # Mount the entire Griego2 folder for live editing
      - ../:/app/:rw
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
